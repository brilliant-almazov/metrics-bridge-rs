name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Run tests
        run: cargo test --all-features
        env:
          REDIS_URL: redis://localhost:6379

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out xml --output-dir coverage
        env:
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: metrics-bridge-linux
          path: target/release/metrics-bridge
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.store }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: redis-7
            image: redis:7-alpine
          - store: redis-6
            image: redis:6-alpine
          - store: dragonfly
            image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
          - store: valkey
            image: valkey/valkey:8-alpine
          - store: keydb
            image: eqalpha/keydb:latest

    services:
      store:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: metrics-bridge-linux
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/metrics-bridge

      - name: Seed test data
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools
          redis-cli -h localhost SADD "PROMETHEUS_:COUNTER_METRIC_KEYS" "http_requests_total"
          redis-cli -h localhost HSET "PROMETHEUS_:counter:http_requests_total" \
            "__meta" '{"name":"http_requests_total","help":"Total HTTP requests","type":"counter","labelNames":["method","status"]}' \
            "$(echo -n '["GET","200"]' | base64)" "1500" \
            "$(echo -n '["POST","200"]' | base64)" "340"
          redis-cli -h localhost SADD "PROMETHEUS_:GAUGE_METRIC_KEYS" "process_memory_bytes"
          redis-cli -h localhost HSET "PROMETHEUS_:gauge:process_memory_bytes" \
            "__meta" '{"name":"process_memory_bytes","help":"Memory usage","type":"gauge","labelNames":["type"]}' \
            "$(echo -n '["heap"]' | base64)" "52428800"

      - name: Create config
        run: |
          cat > config.yaml << EOF
          server:
            port: 9090
            auth:
              type: none
          sources:
            - name: ${{ matrix.store }}-test
              type: promphp-redis
              redis_url: redis://localhost:6379
              prefix: "PROMETHEUS_"
              labels:
                store: ${{ matrix.store }}
          EOF
          cat config.yaml

      - name: Start metrics-bridge
        run: |
          RUST_LOG=metrics_bridge=debug ./bin/metrics-bridge &
          sleep 3
          # Check if process is running
          pgrep -f metrics-bridge || (echo "Process not started!" && exit 1)

      - name: Test endpoints
        id: test
        run: |
          echo "=== Testing ${{ matrix.store }} ===" | tee -a results.txt

          # Health check
          curl -sf http://localhost:9090/health && echo "Health: OK" | tee -a results.txt

          # Ready check
          curl -sf http://localhost:9090/ready && echo "Ready: OK" | tee -a results.txt

          # Metrics
          curl -sf http://localhost:9090/metrics > /tmp/metrics.txt

          grep -q "http_requests_total" /tmp/metrics.txt && echo "Counter metric: OK" | tee -a results.txt
          grep -q "process_memory_bytes" /tmp/metrics.txt && echo "Gauge metric: OK" | tee -a results.txt
          grep -q "metrics_bridge_up 1" /tmp/metrics.txt && echo "Self-metrics: OK" | tee -a results.txt

          echo "ALL_TESTS_PASSED=true" >> $GITHUB_OUTPUT

      - name: Benchmark
        id: benchmark
        run: |
          # Warmup
          for i in $(seq 1 10); do curl -s -o /dev/null http://localhost:9090/metrics; done

          # Benchmark
          START=$(date +%s%N)
          for i in $(seq 1 100); do
            curl -s -o /dev/null http://localhost:9090/metrics
          done
          END=$(date +%s%N)

          DURATION_MS=$(( (END - START) / 1000000 ))
          AVG_MS=$(( DURATION_MS / 100 ))
          RPS=$(( 100000 / DURATION_MS ))

          echo "duration_ms=$DURATION_MS" >> $GITHUB_OUTPUT
          echo "avg_ms=$AVG_MS" >> $GITHUB_OUTPUT
          echo "rps=$RPS" >> $GITHUB_OUTPUT

          echo "100 requests in ${DURATION_MS}ms (avg: ${AVG_MS}ms, ~${RPS} req/s)"

      - name: Write summary
        run: |
          echo "## E2E Results: ${{ matrix.store }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Ready Check | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Counter Metrics | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Gauge Metrics | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Self-Metrics | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 100 requests | ${{ steps.benchmark.outputs.duration_ms }}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Avg latency | ${{ steps.benchmark.outputs.avg_ms }}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Throughput | ~${{ steps.benchmark.outputs.rps }} req/s |" >> $GITHUB_STEP_SUMMARY

  e2e-summary:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()

    steps:
      - name: Check E2E results
        run: |
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "## :white_check_mark: All E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All Redis-compatible stores tested successfully:" >> $GITHUB_STEP_SUMMARY
            echo "- Redis 7" >> $GITHUB_STEP_SUMMARY
            echo "- Redis 6" >> $GITHUB_STEP_SUMMARY
            echo "- Dragonfly" >> $GITHUB_STEP_SUMMARY
            echo "- Valkey" >> $GITHUB_STEP_SUMMARY
            echo "- KeyDB" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Some E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check individual job results for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

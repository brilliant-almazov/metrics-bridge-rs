[package]
name = "metrics-bridge"
version = "0.1.3"
edition = "2021"
description = "High-performance Prometheus metrics exporter for promphp/prometheus_client_php Redis storage. Sub-millisecond latency, 12500+ RPS with caching. Supports Redis, Dragonfly, Valkey, KeyDB. Features: multiple sources aggregation, per-source caching, extra labels, auth (Basic/Bearer/IP whitelist), TLS, GZIP compression. Tiny <10MB Docker image."
license = "MIT"
repository = "https://github.com/brilliant-almazov/metrics-bridge-rs"
homepage = "https://github.com/brilliant-almazov/metrics-bridge-rs"
documentation = "https://github.com/brilliant-almazov/metrics-bridge-rs#readme"
keywords = ["prometheus", "metrics", "redis", "exporter", "monitoring"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
exclude = [
    "docs/*",
    ".github/*",
    "docker-compose*.yml",
    "cloudbuild.yaml",
    "*.md",
    "!README.md",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }

# Redis
deadpool-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Metrics
prometheus = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
base64 = "0.22"
thiserror = "2"
once_cell = "1"
ipnet = "2"
async-trait = "0.1"
futures = "0.3"
flate2 = "1"

# Memory allocator (Linux only)
[target.'cfg(all(target_os = "linux", not(target_env = "msvc")))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
